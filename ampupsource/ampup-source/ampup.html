<title>AmpUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens ===== */
:root {
  --bg: #F7F9F5;
  --bg-grid: rgba(16, 150, 105, 0.07);
  --surface: #FFFFFF;
  --surface-2: #EEF3EC;
  --surface-3: #E3EBE1;
  --ink: #16231D;
  --ink-dim: #5B6B60;
  --ink-faint: #8B9A8F;
  --accent: #0F9D6E;
  --accent-ink: #ffffff;
  --accent-dim: #D8EEE3;
  --copper: #C97A1A;
  --copper-dim: #F6E4C9;
  --danger: #E1483C;
  --danger-dim: #FBDBD8;
  --border: rgba(22, 35, 29, 0.13);
  --border-strong: rgba(22, 35, 29, 0.22);
  --shadow-btn: #0B7A56;
  --shadow-card: rgba(22, 35, 29, 0.10);
  --trace: rgba(15, 157, 110, 0.35);
  --locked: #C7D0C4;
  --locked-ink: #93A08E;
  --gold: #E3A008;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1512;
    --bg-grid: rgba(43, 214, 150, 0.06);
    --surface: #16211C;
    --surface-2: #1C2A23;
    --surface-3: #223026;
    --ink: #E7F2EA;
    --ink-dim: #96AC9F;
    --ink-faint: #6D8377;
    --accent: #2BD696;
    --accent-ink: #06251A;
    --accent-dim: #16342A;
    --copper: #F0B24E;
    --copper-dim: #3A2C13;
    --danger: #F17169;
    --danger-dim: #3A1917;
    --border: rgba(232, 242, 234, 0.12);
    --border-strong: rgba(232, 242, 234, 0.22);
    --shadow-btn: #14A876;
    --shadow-card: rgba(0, 0, 0, 0.35);
    --trace: rgba(43, 214, 150, 0.30);
    --locked: #26332C;
    --locked-ink: #4E6157;
    --gold: #F0C043;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1512;
  --bg-grid: rgba(43, 214, 150, 0.06);
  --surface: #16211C;
  --surface-2: #1C2A23;
  --surface-3: #223026;
  --ink: #E7F2EA;
  --ink-dim: #96AC9F;
  --ink-faint: #6D8377;
  --accent: #2BD696;
  --accent-ink: #06251A;
  --accent-dim: #16342A;
  --copper: #F0B24E;
  --copper-dim: #3A2C13;
  --danger: #F17169;
  --danger-dim: #3A1917;
  --border: rgba(232, 242, 234, 0.12);
  --border-strong: rgba(232, 242, 234, 0.22);
  --shadow-btn: #14A876;
  --shadow-card: rgba(0, 0, 0, 0.35);
  --trace: rgba(43, 214, 150, 0.30);
  --locked: #26332C;
  --locked-ink: #4E6157;
  --gold: #F0C043;
  color-scheme: dark;
}

/* ===== Reset ===== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(circle, var(--bg-grid) 1px, transparent 1px);
  background-size: 22px 22px;
}
h1, h2, h3, h4 { font-family: "Baloo 2", ui-rounded, sans-serif; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font-family: inherit; }
::selection { background: var(--accent-dim); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono, .stat-num, .math { font-family: "IBM Plex Mono", ui-monospace, monospace; }

#app { max-width: 640px; margin: 0 auto; min-height: 100vh; position: relative; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

/* ===== Top bar ===== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: "Baloo 2"; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
.brand-mark { width: 30px; height: 30px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border-radius: 8px; font-size: 16px; }
.stat-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 9px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-weight: 600; font-size: 13px;
}
.stat-num { font-weight: 600; }
.topbar-stats { display: flex; gap: 6px; }
.stat-pill.streak { color: var(--copper); }
.stat-pill.volts { color: var(--accent); }
.theme-toggle {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 15px;
  display: grid; place-items: center;
}

/* ===== Home / path ===== */
.home-header { padding: 22px 20px 6px; }
.home-title { font-size: 26px; font-weight: 700; }
.home-sub { color: var(--ink-dim); font-size: 14px; margin-top: 4px; }

.rank-card {
  margin: 14px 20px 4px; padding: 14px 16px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent-dim), var(--surface-2));
  border: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.rank-icon { font-size: 26px; }
.rank-name { font-family: "Baloo 2"; font-weight: 700; font-size: 15px; }
.rank-bar-track { height: 8px; border-radius: 99px; background: var(--surface-3); margin-top: 6px; overflow: hidden; }
.rank-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s ease; }
.rank-meta { font-size: 11.5px; color: var(--ink-dim); margin-top: 4px; }

.mistakes-card {
  margin: 12px 20px; padding: 12px 14px; border-radius: 14px;
  background: var(--danger-dim); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  transition: transform .12s ease;
}
.mistakes-card:active { transform: scale(0.98); }
.mistakes-card .mi-icon { font-size: 20px; }
.mistakes-card .mi-text { flex: 1; }
.mistakes-card .mi-title { font-weight: 700; font-size: 14px; color: var(--ink); }
.mistakes-card .mi-sub { font-size: 12px; color: var(--ink-dim); }
.mistakes-card .mi-arrow { color: var(--ink-dim); }

.path { position: relative; padding: 28px 0 60px; }
.path::before {
  content: ""; position: absolute; left: 50%; top: 10px; bottom: 40px; width: 0;
  border-left: 3px dashed var(--trace); transform: translateX(-1.5px); z-index: 0;
}

.module-row { position: relative; z-index: 1; display: flex; padding: 10px 0; }
.module-row.align-left { justify-content: flex-start; padding-left: 14%; }
.module-row.align-right { justify-content: flex-end; padding-right: 14%; }
.module-row.align-center { justify-content: center; }
.module-row > div { padding-bottom: 38px; }

.module-node {
  width: 84px; height: 84px; position: relative;
  background: var(--surface); border: 2px solid var(--border-strong);
  clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 4px 0 var(--border-strong), 0 6px 10px var(--shadow-card);
  transition: transform .12s ease;
}
.module-node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--border-strong); }
.module-node.current { background: var(--accent); border-color: var(--shadow-btn); box-shadow: 0 4px 0 var(--shadow-btn), 0 6px 14px var(--shadow-card); }
.module-node.current .module-icon { filter: none; }
.module-node.completed { background: var(--accent-dim); border-color: var(--accent); }
.module-node.locked { cursor: default; box-shadow: 0 4px 0 var(--border); background: var(--surface-2); }
.module-node.locked:active { transform: none; }
.module-icon { font-size: 30px; }
.module-node.locked .module-icon { opacity: 0.35; filter: grayscale(1); }
.module-check {

  position: absolute; top: -6px; right: -2px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; border: 2px solid var(--bg);
}
.module-label {
  position: absolute; top: 100%; margin-top: 6px; left: 50%; transform: translateX(-50%);
  font-size: 11.5px; font-weight: 600; color: var(--ink-dim);
  width: 128px; text-align: center; line-height: 1.25;
  background: var(--bg); padding: 1px 4px; border-radius: 6px;
}
.module-node.locked + .module-label { color: var(--ink-faint); }
.star-on { color: var(--gold); }
.star-off { color: var(--ink-faint); opacity: 0.5; }

/* ===== Sheet / modal ===== */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 11, 0.5); z-index: 40; opacity: 0; animation: fadeIn .18s ease forwards; }
@keyframes fadeIn { to { opacity: 1; } }
.sheet {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 0); width: 100%; max-width: 640px;
  background: var(--surface); border-radius: 20px 20px 0 0; z-index: 41; padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  border: 1px solid var(--border); border-bottom: none;
  box-shadow: 0 -10px 30px var(--shadow-card);
  animation: slideUp .22s cubic-bezier(.2,.9,.25,1) forwards;
  max-height: 82vh; overflow-y: auto;
}
@keyframes slideUp { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet-handle { width: 36px; height: 4px; border-radius: 99px; background: var(--border-strong); margin: 0 auto 14px; }
.sheet-header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.sheet-icon { width: 46px; height: 46px; border-radius: 12px; background: var(--accent-dim); display: grid; place-items: center; font-size: 24px; }
.sheet-title { font-family: "Baloo 2"; font-weight: 700; font-size: 19px; }
.sheet-blurb { color: var(--ink-dim); font-size: 13px; margin-top: 2px; }
.sheet-close { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; display: grid; place-items: center; color: var(--ink); }

.lab-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.lab-card {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
  background: var(--surface-2); border: 1px solid var(--border); cursor: pointer;
  transition: transform .12s ease;
}
.lab-card:active { transform: scale(0.98); }
.lab-card.locked { opacity: 0.55; cursor: default; }
.lab-card.locked:active { transform: none; }
.lab-emoji { font-size: 20px; width: 30px; text-align: center; }
.lab-info { flex: 1; }
.lab-name { font-weight: 700; font-size: 14.5px; }
.lab-meta { font-size: 12px; color: var(--ink-dim); margin-top: 1px; }
.lab-stars { font-size: 13px; letter-spacing: 1px; }
.lab-go { color: var(--ink-dim); }

/* ===== Lesson screen ===== */
.lesson-screen { min-height: 100vh; display: flex; flex-direction: column; }
.lesson-top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.lesson-exit { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: var(--ink-dim); cursor: pointer; font-size: 20px; display: grid; place-items: center; }
.progress-track { flex: 1; height: 12px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.charge-meter { display: flex; gap: 3px; align-items: center; }
.charge-bolt { font-size: 16px; filter: grayscale(0); transition: opacity .2s, transform .2s; }
.charge-bolt.spent { opacity: 0.22; filter: grayscale(1); }

.lesson-body { flex: 1; display: flex; flex-direction: column; padding: 8px 20px 20px; }
.q-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
.q-text { font-size: 19px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
.q-diagram-link {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; align-self: flex-start;
  padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--border-strong);
  color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600;
}

.options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.option {
  text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--border);
  background: var(--surface); color: var(--ink); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 3px 0 var(--border);
  transition: transform .1s ease, border-color .15s, background .15s;
}
.option:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.option .opt-badge {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border-strong); display: grid; place-items: center;
  font-family: "IBM Plex Mono"; font-size: 12px; font-weight: 600; color: var(--ink-dim); flex-shrink: 0;
}
.option.selected { border-color: var(--accent); background: var(--accent-dim); }
.option.correct { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 3px 0 var(--accent); }
.option.correct .opt-badge { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.option.wrong { border-color: var(--danger); background: var(--danger-dim); box-shadow: 0 3px 0 var(--danger); }
.option.wrong .opt-badge { background: var(--danger); border-color: var(--danger); color: white; }
.option.dimmed { opacity: 0.5; }
.option:disabled { cursor: default; }

.feedback-bar {
  position: sticky; bottom: 0; margin: 16px -20px -20px; padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px;
}
.feedback-bar.correct { background: var(--accent-dim); border-top: 2px solid var(--accent); }
.feedback-bar.wrong { background: var(--danger-dim); border-top: 2px solid var(--danger); }
.feedback-head { display: flex; align-items: center; gap: 8px; font-family: "Baloo 2"; font-weight: 700; font-size: 16px; }
.feedback-bar.correct .feedback-head { color: var(--accent); }
.feedback-bar.wrong .feedback-head { color: var(--danger); }
.feedback-explain { font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; }
.feedback-explain b { color: var(--ink); }

.btn { font-family: "Baloo 2"; font-weight: 700; font-size: 15px; letter-spacing: 0.01em; border-radius: 14px; padding: 13px 20px; border: none; cursor: pointer; text-align: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--shadow-btn); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow-btn); }
.btn-primary:disabled { background: var(--locked); color: var(--locked-ink); box-shadow: 0 4px 0 var(--border); cursor: default; }
.btn-danger { background: var(--danger); color: white; box-shadow: 0 4px 0 #a5322a; }
.btn-danger:active { transform: translateY(3px); box-shadow: 0 1px 0 #a5322a; }
.btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); }
.btn-block { width: 100%; }

/* ===== Summary screen ===== */
.summary-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; text-align: center; }
.summary-badge { font-size: 64px; margin-bottom: 6px; }
.summary-title { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
.summary-sub { color: var(--ink-dim); font-size: 14px; margin-bottom: 26px; }
.summary-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 380px; margin-bottom: 30px; }
.summary-stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 6px; }
.summary-stat .val { font-family: "IBM Plex Mono"; font-weight: 600; font-size: 19px; }
.summary-stat .lbl { font-size: 11px; color: var(--ink-dim); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
.summary-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 380px; }
.summary-stars { font-size: 30px; letter-spacing: 4px; margin-bottom: 18px; }

/* ===== Misc ===== */
.hidden { display: none !important; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; line-height: 1.1; font-size: 0.92em; }
.frac .num { border-bottom: 1.4px solid currentColor; padding: 0 3px 1px; }
.frac .den { padding: 1px 3px 0; }
.sqrt { white-space: nowrap; }
.mtext { font-family: "IBM Plex Sans"; }
sup, sub { line-height: 0; }

.empty-state { text-align: center; padding: 60px 24px; color: var(--ink-dim); }
.empty-state .ee { font-size: 40px; margin-bottom: 10px; }

.footer-note { text-align: center; font-size: 11.5px; color: var(--ink-faint); padding: 10px 24px 30px; }

@media (max-width: 380px) {
  .module-row.align-left { padding-left: 8%; }
  .module-row.align-right { padding-right: 8%; }
  .module-node { width: 76px; height: 76px; }
  .module-icon { font-size: 26px; }
}

</style>

<script id="questions-data" type="application/json">[{"id": "101", "questionHtml": "Find the number of nodes (n), branches (b), and loops (l) for the network in Figure below.", "options": ["n=9, I=11, b=19", "n=7, I=7, b=13", "n=9, I=7, b=15"], "optionsHtml": ["n=9, I=11, b=19", "n=7, I=7, b=13", "n=9, I=7, b=15"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsEasyQ1.png?raw=true", "explanationHtml": "Count nodes (junctions), branches (elements), and independent loops using Euler's formula: l = b - n + 1. The answer is n=9, b=15, l=7 (option C).", "difficulty": 1}, {"id": "102", "questionHtml": "Calculate the current going through the voltage source (a) when the switch is in position 1, and (b) when the switch is in position 2.", "options": ["\\((a) 300\\,\\text{mA}, (b) 400\\,\\text{mA}\\)", "\\((a) 800\\,\\text{mA}, (b) 300\\,\\text{mA}\\)", "\\((a) 400\\,\\text{mA}, (b) 300\\,\\text{mA}\\)"], "optionsHtml": ["<span class=\"math\">(a) 300 <span class=\"mtext\">mA<\/span>, (b) 400 <span class=\"mtext\">mA<\/span><\/span>", "<span class=\"math\">(a) 800 <span class=\"mtext\">mA<\/span>, (b) 300 <span class=\"mtext\">mA<\/span><\/span>", "<span class=\"math\">(a) 400 <span class=\"mtext\">mA<\/span>, (b) 300 <span class=\"mtext\">mA<\/span><\/span>"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsEasyQ2.png?raw=true", "explanationHtml": "Use Ohm's Law (I = V/R) with the two switch positions. Position 1: one resistor set active; Position 2: a different resistor set active. Apply the given supply voltage to each case separately.", "difficulty": 1}, {"id": "103", "questionHtml": "Determine the value of <span class=\"math\">R<\/span> in ohms. (Please round answer to 2 decimal places).", "options": ["1.3", "1.23", "1.25"], "optionsHtml": ["1.3", "1.23", "1.25"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsEasyQ3.png?raw=true", "explanationHtml": "Apply KVL or the voltage divider rule around the circuit loop. Set up the equation V_source = V_R + V_other and solve for R. The answer rounds to 1.25 Ω.", "difficulty": 1}, {"id": "104", "questionHtml": "According to Ohm's Law, if the resistance in a circuit is doubled while the voltage remains constant, what happens to the current?", "options": ["The current doubles.", "The current remains the same.", "The current is halved."], "optionsHtml": ["The current doubles.", "The current remains the same.", "The current is halved."], "correctIndex": 2, "image": "", "explanationHtml": "Ohm's Law states V = IR, so I = V/R. If R doubles and V stays constant, I = V/(2R) = half the original current. The current is halved.", "difficulty": 1}, {"id": "105", "questionHtml": "Kirchhoff's Current Law (KCL) is a direct consequence of which fundamental physical principle?", "options": ["Conservation of Energy", "Conservation of Charge", "Conservation of Momentum"], "optionsHtml": ["Conservation of Energy", "Conservation of Charge", "Conservation of Momentum"], "correctIndex": 1, "image": "", "explanationHtml": "KCL is based on conservation of charge — charge cannot be created or destroyed at a node. The sum of currents entering a node must equal the sum of currents leaving.", "difficulty": 1}, {"id": "106", "questionHtml": "In any closed loop of a circuit, the algebraic sum of all voltages (potential differences) must be equal to:", "options": ["Zero", "The supply voltage", "The sum of the resistances"], "optionsHtml": ["Zero", "The supply voltage", "The sum of the resistances"], "correctIndex": 0, "image": "", "explanationHtml": "Kirchhoff's Voltage Law (KVL) states that the algebraic sum of all voltages around any closed loop equals zero. This is a consequence of conservation of energy.", "difficulty": 1}, {"id": "107", "questionHtml": "Using the passive sign convention, if the calculated power P=VI for a specific component is negative, what does this indicate?", "options": ["The component is consuming energy.", "The component is supplying energy to the circuit.", "The component is behaving as a short circuit."], "optionsHtml": ["The component is consuming energy.", "The component is supplying energy to the circuit.", "The component is behaving as a short circuit."], "correctIndex": 1, "image": "", "explanationHtml": "Under the passive sign convention, positive power means energy is absorbed. If P = VI is negative, the element is delivering (supplying) energy to the rest of the circuit.", "difficulty": 1}, {"id": "108", "questionHtml": "A Thevenin equivalent circuit consists of which two elements?", "options": ["A current source in parallel with a resistor.", "A voltage source in series with a resistor.", "A voltage source in parallel with a capacitor."], "optionsHtml": ["A current source in parallel with a resistor.", "A voltage source in series with a resistor.", "A voltage source in parallel with a capacitor."], "correctIndex": 1, "image": "", "explanationHtml": "A Thevenin equivalent simplifies any linear two-terminal network to a single voltage source (V_th) in series with a single resistance (R_th).", "difficulty": 1}, {"id": "109", "questionHtml": "The Superposition Principle can only be applied to circuits that are:", "options": ["Non-linear", "Linear", "Purely inductive"], "optionsHtml": ["Non-linear", "Linear", "Purely inductive"], "correctIndex": 1, "image": "", "explanationHtml": "The Superposition Principle applies only to linear circuits. It states that the response (voltage or current) in any element equals the sum of responses caused by each independent source acting alone.", "difficulty": 1}, {"id": "110", "questionHtml": "How is the Norton resistance, <span class=\"math\">R<sub>n<\/sub><\/span> related to the Thevenin resistance, <span class=\"math\">R<sub>th<\/sub><\/span> for the same network?", "options": ["$R_n$ is the reciprocal of $R_{th}$.", "$R_n$ is the always double $R_{th}$.", "$R_n$ is the equal to $R_{th}$."], "optionsHtml": ["<span class=\"math\">R<sub>n<\/sub><\/span> is the reciprocal of <span class=\"math\">R<sub>th<\/sub><\/span>.", "<span class=\"math\">R<sub>n<\/sub><\/span> is the always double <span class=\"math\">R<sub>th<\/sub><\/span>.", "<span class=\"math\">R<sub>n<\/sub><\/span> is the equal to <span class=\"math\">R<sub>th<\/sub><\/span>."], "correctIndex": 2, "image": "", "explanationHtml": "Norton resistance R_n and Thevenin resistance R_th are found using the same method (deactivating independent sources), so R_n = R_th for the same network.", "difficulty": 1}, {"id": "111", "questionHtml": "For a DC circuit with a fixed source resistance <span class=\"math\">R<sub>s<\/sub><\/span>, maximum power is delivered to a load <span class=\"math\">R<sub>L<\/sub><\/span> when:", "options": ["\\(R_L = 0 \\)", "\\(R_L = infinity \\)", "\\(R_L = R_s\\)"], "optionsHtml": ["<span class=\"math\">R<sub>L<\/sub> = 0 <\/span>", "<span class=\"math\">R<sub>L<\/sub> = infinity <\/span>", "<span class=\"math\">R<sub>L<\/sub> = R<sub>s<\/sub><\/span>"], "correctIndex": 2, "image": "", "explanationHtml": "The Maximum Power Transfer Theorem states that maximum power is delivered to the load when R_L = R_s (load resistance equals source resistance).", "difficulty": 1}, {"id": "112", "questionHtml": "Determine <span class=\"math\">i1, i2, i3<\/span> in the circuit below.", "options": ["$i1=12, i2=0, i3=3$", "$i1=13, i2=1, i3=2$", "$i1=12, i2=0, i3=4$"], "optionsHtml": ["<span class=\"math\">i1=12, i2=0, i3=3<\/span>", "<span class=\"math\">i1=13, i2=1, i3=2<\/span>", "<span class=\"math\">i1=12, i2=0, i3=4<\/span>"], "correctIndex": 0, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsAverageQ1.png?raw=true", "explanationHtml": "Apply KCL at each node. At the top node: i1 = i2 + i3. Use Ohm's Law for each branch. Solving gives i1=12 A, i2=0 A, i3=3 A (or equivalent — check with image).", "difficulty": 2}, {"id": "113", "questionHtml": "Find <span class=\"math\">V1, V2, V3, V4<\/span> in the circuit below.", "options": ["$V1=8,V2=5,V3=2,V4=3$", "$V1=-2,V2=-1,V3=-4,V4=9$", "$V1=8,V2=5,V3=2,V4=4$"], "optionsHtml": ["<span class=\"math\">V1=8,V2=5,V3=2,V4=3<\/span>", "<span class=\"math\">V1=-2,V2=-1,V3=-4,V4=9<\/span>", "<span class=\"math\">V1=8,V2=5,V3=2,V4=4<\/span>"], "correctIndex": 1, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsAverageQ2.png?raw=true", "explanationHtml": "Apply KVL around each loop. Assign loop currents and solve the system of equations. The solution depends on the circuit topology in the image.", "difficulty": 2}, {"id": "114", "questionHtml": "Determine <span class=\"math\">V<sub>1<\/sub><\/span> in the below circuit. (Please round answer to 2 decimal places).", "options": ["25.85", "25.32", "26.18"], "optionsHtml": ["25.85", "25.32", "26.18"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsAverageQ3.png?raw=true", "explanationHtml": "Use nodal analysis or mesh analysis to find V1. Set up KCL at each node, write the equations, and solve. Round final answer to 2 decimal places.", "difficulty": 2}, {"id": "115", "questionHtml": "Calculate <span class=\"math\">v<\/span> and <span class=\"math\">ix<\/span> in the circuit below.", "options": ["$v=-4,ix=8$", "$v=4,ix=-3.33$", "$v=-4,ix=9$"], "optionsHtml": ["<span class=\"math\">v=-4,ix=8<\/span>", "<span class=\"math\">v=4,ix=-3.33<\/span>", "<span class=\"math\">v=-4,ix=9<\/span>"], "correctIndex": 1, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsAverageQ4.png?raw=true", "explanationHtml": "Use KVL and Ohm's Law. Note that ix is a branch current controlled by the dependent source. Write the dependent source equation and solve simultaneously with KVL.", "difficulty": 2}, {"id": "116", "questionHtml": "Calculate <span class=\"math\">v<sub>1<\/sub><\/span>, <span class=\"math\">v<sub>2<\/sub><\/span>, and <span class=\"math\">v<sub>3<\/sub><\/span>.", "op s).", "options": ["23.33", "24.26", "24.25"], "optionsHtml": ["23.33", "24.26", "24.25"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsAverageQ12.png?raw=true", "explanationHtml": "Use series/parallel combinations or delta-wye transformation to simplify the resistor network between terminals a and b. Round the final result to 2 decimal places.", "difficulty": 2}, {"id": "124", "questionHtml": "In the below circuit, determine <span class=\"math\">V<sub>o<\/sub><\/span> and the power absorbed by the dependent source.", "options": ["$V_o$ = -11.43, $P$ = 574.7", "$V_o$ = -11.41, $P$ = 574.8", "$V_o$ = -11.45, $P$ = 575.01"], "optionsHtml": ["<span class=\"math\">V<sub>o<\/sub><\/span> = -11.43, <span class=\"math\">P<\/span> = 574.7", "<span class=\"math\">V<sub>o<\/sub><\/span> = -11.41, <span class=\"math\">P<\/span> = 574.8", "<span class=\"math\">V<sub>o<\/sub><\/span> = -11.45, <span class=\"math\">P<\/span> = 575.01"], "correctIndex": 0, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsChallengingQ1.png?raw=true", "explanationHtml": "With a dependent source, write KVL/KCL including the dependent variable. Solve the system for Vo. Power absorbed by the dependent source = V_dep × I_dep (with correct sign).", "difficulty": 3}, {"id": "126", "questionHtml": "Determine <span class=\"math\">V<sub>o<\/sub><\/span> and <span class=\"math\">I<sub>o<\/sub><\/span>.", "options": ["$V_o$ = 60.3 V, $I_o$ = 1.13 A", "$V_o$ = 52.4 V, $I_o$ = 0.67 A", "$V_o$ = 50 V, $I_o$ = 0 A"], "optionsHtml": ["<span class=\"math\">V<sub>o<\/sub><\/span> = 60.3 V, <span class=\"math\">I<sub>o<\/sub><\/span> = 1.13 A", "<span class=\"math\">V<sub>o<\/sub><\/span> = 52.4 V, <span class=\"math\">I<sub>o<\/sub><\/span> = 0.67 A", "<span class=\"math\">V<sub>o<\/sub><\/span> = 50 V, <span class=\"math\">I<sub>o<\/sub><\/span> = 0 A"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsChallengingQ3.png?raw=true", "explanationHtml": "Use superposition or direct nodal/mesh analysis. For the specific topology in the image, Vo = 50 V and Io = 0 A is the result after solving.", "difficulty": 3}, {"id": "127", "questionHtml": "Calculate <span class=\"math\">V<\/span> and <span class=\"math\">I<\/span> in the circuit below.", "options": ["\\(V = 4.64\\,\\text{V}, I = 10.41\\,\\text{A}\\)", "\\(V = 3.85\\,\\text{V}, I = 8.19\\,\\text{A}\\)", "\\(V = 3.81\\,\\text{V}, I = 8.19\\,\\text{A}\\)"], "optionsHtml": ["<span class=\"math\">V = 4.64 <span class=\"mtext\">V<\/span>, I = 10.41 <span class=\"mtext\">A<\/span><\/span>", "<span class=\"math\">V = 3.85 <span class=\"mtext\">V<\/span>, I = 8.19 <span class=\"mtext\">A<\/span><\/span>", "<span class=\"math\">V = 3.81 <span class=\"mtext\">V<\/span>, I = 8.19 <span class=\"mtext\">A<\/span><\/span>"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsChallengingQ4.png?raw=true", "explanationHtml": "Apply KCL/KVL or Thevenin equivalent to find V and I. The answer is V≈3.81 V and I≈8.19 A (check the circuit image for component values).", "difficulty": 3}, {"id": "128", "questionHtml": "Calculate the equivalent resistance between a and b terminals. All of the resistances are 60 <span class=\"math\">Ω<\/span> .", "options": ["66.67", "66.64", "66.61"], "optionsHtml": ["66.67", "66.64", "66.61"], "correctIndex": 0, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W1_BasicLawsChallengingQ5.png?raw=true", "explanationHtml": "When all resistors are equal (60 Ω), use the balanced-network simplification. For typical ladder or bridge configurations, R_eq ≈ 66.67 Ω.", "difficulty": 3}, {"id": "201", "questionHtml": "Find Leq in the circuit below. Assume L = <span class=\"math\">10 <span class=\"mtext\">mH<\/span><\/span>", "options": ["5", "5.33", "4.54"], "optionsHtml": ["5", "5.33", "4.54"], "correctIndex": 0, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W2_ESEEasyQ1.png?raw=true", "explanationHtml": "For inductors in series: L_eq = L1 + L2 + ... For inductors in parallel: 1/L_eq = 1/L1 + 1/L2 + ... Combine the inductors in the figure step by step with L = 10 mH each.", "difficulty": 1}, {"id": "202", "questionHtml": "A circuit consisting of a DC voltage source, a resistor, and a capacitor has been connected for a very long time. In this steady-state condition, how does the capacitor behave in the circuit?", "options": ["It acts as a short circuit", "It acts as an open circuit.", "It acts as a purely resistive element."], "optionsHtml": ["It acts as a short circuit", "It acts as an open circuit.", "It acts as a purely resistive element."], "correctIndex": 1, "image": "", "explanationHtml": "In a DC RC circuit at steady state, the capacitor is fully charged and acts as an open circuit. The steady-state voltage across the capacitor equals the source voltage minus any drops across series resistors.", "difficulty": 1}, {"id": "203", "questionHtml": "An inductor with an inductance of L = <span class=\"math\">4 <span class=\"mtext\">mH<\/span><\/span> has a steady current of I = <span class=\"math\">5 <span class=\"mtext\">A<\/span><\/span> flowing through it. What is the total energy stored in the inductor's magnetic field?", "options": ["\\(10\\,\\text{mJ}\\)", "\\(50\\,\\text{mJ}\\)", "\\(100\\,\\text{mJ}\\)"], "optionsHtml": ["<span class=\"math\">10 <span class=\"mtext\">mJ<\/span><\/span>", "<span class=\"math\">50 <span class=\"mtext\">mJ<\/span><\/span>", "<span class=\"math\">100 <span class=\"mtext\">mJ<\/span><\/span>"], "correctIndex": 0, "image": "", "explanationHtml": "The energy stored in an inductor is: E = ½LI². With L = 4 mH and I = 8 A: E = ½ × 0.004 × 64 = 0.128 J. The voltage across the inductor is V = L(di/dt).", "difficulty": 1}, {"id": "204", "questionHtml": "A student connects two capacitors of 10microF in series. What is the equivalent capacitance of this combination?", "options": ["20microF", "10microF", "5microF"], "optionsHtml": ["20microF", "10microF", "5microF"], "correctIndex": 1, "image": "", "explanationHtml": "Capacitors in series: 1/C_eq = 1/C1 + 1/C2. For two 10 μF capacitors in series: C_eq = 10/2 = 5 μF.", "difficulty": 1}, {"id": "205", "questionHtml": "A switch in a circuit containing an inductor is suddenly opened at t=0. Which of the following statements is true regarding the inductor's current, <span class=\"math\">i<sub>L<\/sub><\/span>, the moment the switch is toggled?", "options": ["The current immediately drops to zero.", "The current reverses direction instantly.", "The current cannot change instantaneously"], "optionsHtml": ["The current immediately drops to zero.", "The current reverses direction instantly.", "The current cannot change instantaneously"], "correctIndex": 1, "image": "", "explanationHtml": "An inductor resists instantaneous change in current. When a switch suddenly opens in an inductive circuit, the inductor tries to maintain current, which can cause a large voltage spike (V = L·di/dt).", "difficulty": 1}, {"id": "206", "questionHtml": "The voltage across a parallel combination of <span class=\"math\">120 <span class=\"mtext\">mF<\/span><\/span> capacitor and a 15 <span class=\"math\">Ω<\/span>  resistor is 45<span class=\"math\">e<sup>-2000t<\/sup><\/span> V. Calculate the power which is absorbed by this parallel combination.", "options": ["\\(-486000e^{-4000t}\\)", "\\(-486020e^{-4050t}\\)", "\\(-485865e^{-4000t}\\)"], "optionsHtml": ["<span class=\"math\">-486000e<sup>-4000t<\/sup><\/span>", "<span class=\"math\">-486020e<sup>-4050t<\/sup><\/span>", "<span class=\"math\">-485865e<sup>-4000t<\/sup><\/span>"], "correctIndex": 2, "image": "", "explanationHtml": "Capacitors in parallel share the same voltage. Apply KCL in the parallel branch: i_total = C_total × dv/dt. Use the given voltage waveform to find the parallel capacitance.", "difficulty": 2}, {"id": "207", "questionHtml": "The current through a <span class=\"math\">1 <span class=\"mtext\">F<\/span><\/span> capacitor is 8(2-<span class=\"math\">e<sup>-t<\/sup><\/span>) A. Determine the voltage and power at t = 3s. Assume v(0)= 0.", "options": ["V = 40.4, P = 630.31", "V = 40.12, P = 630.32", "V = 40.1, P = 630.31"], "optionsHtml": ["V = 40.4, P = 630.31", "V = 40.12, P = 630.32", "V = 40.1, P = 630.31"], "correctIndex": 2, "image": "", "explanationHtml": "The voltage across a capacitor is v(t) = (1/C)∫i dt + v(0). Integrate i = 8(2 - e^{-4t}) over the interval and add the initial condition to find the answer.", "difficulty": 2}, {"id": "208", "questionHtml": "Find the equivalent capacitance for the circuit below. All capacitors are in <span class=\"math\">μ<\/span> F.", "options": ["Ceq = 8.1", "Ceq = 8.4", "Ceq = 8.7"], "optionsHtml": ["Ceq = 8.1", "Ceq = 8.4", "Ceq = 8.7"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W2_ESEAverageQ3.png?raw=true", "explanationHtml": "Combine capacitors using series and parallel rules. Parallel: C_eq = C1 + C2. Series: 1/C_eq = 1/C1 + 1/C2. Work outward from the innermost combination.", "difficulty": 2}, {"id": "209", "questionHtml": "An inductor has a linear change in current from 40 mA to 120 mA in 3 ms, and induces a voltage of 150 mV. Find the value of the inductor.", "options": ["L = 5.526 mH", "\\(L = 5.265\\,\\text{mH}\\)", "L = 5.625 mH"], "optionsHtml": ["L = 5.526 mH", "<span class=\"math\">L = 5.265 <span class=\"mtext\">mH<\/span><\/span>", "L = 5.625 mH"], "correctIndex": 0, "image": "", "explanationHtml": "The inductor voltage is V = L(di/dt). With a linear change: di/dt = ΔI/Δt = (120-40)×10⁻³ / Δt. Multiply by L to get the voltage.", "difficulty": 2}, {"id": "210", "questionHtml": "Determine the voltage and the energy stored in the 60 μF capacitor.", "options": ["\\(V = 60.0\\,\\text{V}, W=108.0\\,\\text{mJ}\\)", "\\(V = 60.5\\,\\text{V}, W=108.3\\,\\text{mJ}\\)", "\\(V = 58.0\\,\\text{V}, W=108.0\\,\\text{mJ}\\)"], "optionsHtml": ["<span class=\"math\">V = 60.0 <span class=\"mtext\">V<\/span>, W=108.0 <span class=\"mtext\">mJ<\/span><\/span>", "<span class=\"math\">V = 60.5 <span class=\"mtext\">V<\/span>, W=108.3 <span class=\"mtext\">mJ<\/span><\/span>", "<span class=\"math\">V = 58.0 <span class=\"mtext\">V<\/span>, W=108.0 <span class=\"mtext\">mJ<\/span><\/span>"], "correctIndex": 1, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W2_ESEAverageQ5.png?raw=true", "explanationHtml": "At DC steady state, inductor → short circuit (V_L = 0), capacitor → open circuit (I_C = 0). Find the voltage across the 60 μF capacitor from the resulting resistive circuit, then E = ½CV².", "difficulty": 2}, {"id": "211", "questionHtml": "Find the equivalent inductance with respect to terminals a and b.", "options": ["\\(Leq = 9.2\\,\\text{H}\\)", "\\(Leq = 9.3\\,\\text{H}\\)", "\\(Leq = 9.1\\,\\text{H}\\)"], "optionsHtml": ["<span class=\"math\">Leq = 9.2 <span class=\"mtext\">H<\/span><\/span>", "<span class=\"math\">Leq = 9.3 <span class=\"mtext\">H<\/span><\/span>", "<span class=\"math\">Leq = 9.1 <span class=\"mtext\">H<\/span><\/span>"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W2_ESEAverageQ6.png?raw=true", "explanationHtml": "Use series/parallel inductor combination rules. Pay attention to the dot notation if mutual inductance is involved. Combine step by step from the terminal pair.", "difficulty": 2}, {"id": "212", "questionHtml": "Two magnetically coupled coils have self-inductances of 20 mH and 80 mH, and the mutual inductance between them is 32 mH. Find (a) the coefficient of coupling, and (b) the largest value that M can have.", "options": ["\\(K = 0.8555, M_{max} = 40.0\\,\\text{mH}\\)", "\\(K = 0.8, M_{max} = 40.55\\,\\text{mH}\\)", "\\(K = 0.8, M_{max} = 40.0\\,\\text{mH}\\)"], "optionsHtml": ["<span class=\"math\">K = 0.8555, M<sub>max<\/sub> = 40.0 <span class=\"mtext\">mH<\/span><\/span>", "<span class=\"math\">K = 0.8, M<sub>max<\/sub> = 40.55 <span class=\"mtext\">mH<\/span><\/span>", "<span class=\"math\">K = 0.8, M<sub>max<\/sub> = 40.0 <span class=\"mtext\">mH<\/span><\/span>"], "correctIndex": 0, "image": "", "explanationHtml": "For magnetically coupled coils, the equivalent inductance depends on whether they are series-aiding or series-opposing. L_eq = L1 + L2 ± 2M where M is the mutual inductance.", "difficulty": 2}, {"id": "213", "questionHtml": "The voltage across a 30 mF capacitor at t = 0 is 15 V, for t &gt; 0 the current 6t mA flows through it. Calculate the voltage at 3 = 3s.", "options": ["\\(V = 15.3\\,\\text{V}\\)", "\\(V = 15.9\\,\\text{V}\\)", "\\(V = 16.3\\,\\text{V}\\)"], "optionsHtml": ["<span class=\"math\">V = 15.3 <span class=\"mtext\">V<\/span><\/span>", "<span class=\"math\">V = 15.9 <span class=\"mtext\">V<\/span><\/span>", "<span class=\"math\">V = 16.3 <span class=\"mtext\">V<\/span><\/span>"], "correctIndex": 0, "image": "", "explanationHtml": "Use v_C(t) = (1/C)∫i dt + v_C(0). Given v_C(0) = 15 V and the current waveform, integrate over [0, t] and over [t, ∞] as specified in the problem.", "difficulty": 2}, {"id": "214", "questionHtml": "Find <span class=\"math\">i<sub>L<\/sub>, V<sub>c<\/sub><\/span>, and the energy stored in the capacitor and inductor in the below circuit.", "options": ["\\(i_L\\) = \\(2.86\\,\\text{A}, V_c\\) = \\(0\\,\\text{V}, W_L\\) = \\(8.16\\,\\text{J}, W_C\\) = \\(0.5\\,\\text{J}\\)", "\\(i_L\\) = \\(2.86\\,\\text{A}, V_c\\) = \\(0.3\\,\\text{V}, W_L\\) = \\(8.16\\,\\text{J}, W_C\\) = \\(0\\,\\text{J}\\)", "\\(i_L\\) = \\(2.86\\,\\text{A}, V_c\\) = \\(0\\,\\text{V}, W_L\\) = \\(8.16\\,\\text{J}, W_C\\) = \\(0\\,\\text{J}\\)"], "optionsHtml": ["<span class=\"math\">i<sub>L<\/sub><\/span> = <span class=\"math\">2.86 <span class=\"mtext\">A<\/span>, V<sub>c<\/sub><\/span> = <span class=\"math\">0 <span class=\"mtext\">V<\/span>, W<sub>L<\/sub><\/span> = <span class=\"math\">8.16 <span class=\"mtext\">J<\/span>, W<sub>C<\/sub><\/span> = <span class=\"math\">0.5 <span class=\"mtext\">J<\/span><\/span>", "<span class=\"math\">i<sub>L<\/sub><\/span> = <span class=\"math\">2.86 <span class=\"mtext\">A<\/span>, V<sub>c<\/sub><\/span> = <span class=\"math\">0.3 <span class=\"mtext\">V<\/span>, W<sub>L<\/sub><\/span> = <span class=\"math\">8.16 <span class=\"mtext\">J<\/span>, W<sub>C<\/sub><\/span> = <span class=\"math\">0 <span class=\"mtext\">J<\/span><\/span>", "<span class=\"math\">i<sub>L<\/sub><\/span> = <span class=\"math\">2.86 <span class=\"mtext\">A<\/span>, V<sub>c<\/sub><\/span> = <span class=\"math\">0 <span class=\"mtext\">V<\/span>, W<sub>L<\/sub><\/span> = <span class=\"math\">8.16 <span class=\"mtext\">J<\/span>, W<sub>C<\/sub><\/span> = <span class=\"math\">0 <span class=\"mtext\">J<\/span><\/span>"], "correctIndex": 2, "image": "https://raw.github.com/DinYeo/DuolingoforCA/main/W2_ESEAverageQ9.png?raw=true", "explanationHtml": "At DC steady state: inductor = short circuit, capacitor = open circuit. Redraw the simplified circuit and solve using Ohm's Law and voltage dividers to find i_L and V_c.", "difficulty": 2}, {"id": "215", "questionHtml": "P = -0.207microW\"", "options": ["\\(i = -3.381\\,\\text{mA}, P = -0.270\\,\\mu\\text{W}\\)", "\\(i = -3.339\\,\\text{mA}, P = -0.207\\,\\mu\\text{W}\\)", "\\(i = -3.379\\,\\text{mA}, P = -0.267\\,\\mu\\text{W}\\)"], "optionsHtml": ["<span class=\"math\">i = -3.381 <span class=\"mtext\">mA<\/span>, P = -0.270 μ<span class=\"mtext\">W<\/span><\/span>", "<span class=\"math\">i = -3.339 <span class=\"mtext\">mA<\/span>, P = -0.207 μ<span class=\"mtext\">W<\/span><\/span>", "<span class=\"math\">i = -3.379 <span class=\"mtext\">mA<\/span>, P = -0.267 μ<span class=\"mtext\">W<\/span><\/span>"], "correctIndex": 1, "image": "", "explanationHtml": "This is a power calculation: P = V × I or P = I²R. Given the negative sign, the element is delivering (-0.207 μW) of power. Check component values from the circuit image.", "difficulty": 2}, {"id": "216", "questionHtml": "The current through a <span class=\"math\">15 <span class=\"mtext\">mH<\/span><\/span> inductor is 20<span class=\"math\">e<sup>-t/3<\/sup><\/span>. Calculate the voltage and power at t = 4s.", "options": ["\\(v = -26.359\\,\\text{mV}, P = -138.966\\,\\text{mW}\\)", "\\(v = -27.359\\,\\text{mV}, P = -133.966\\,\\text{mW}\\)", "\\(v = -26.359\\,\\text{mV}, P = -138.696\\,\\text{mW}\\)"], "optionsHtml": ["<span class=\"math\">v = -26.359 <span class=\"mtext\">mV<\/span>, P = -138.966 <span class=\"mtext\">mW<\/span><\/span>", "<span class=\"math\">v = -27.359 <span class=\"mtext\">mV<\/span>, P = -133.966 <span class=\"mtext\">mW<\/span><\/span>", "<span class=\"math\">v = -26.359 <span class=\"mtext\">mV<\/span>, P = -138.696 <span class=\"mtext\">mW<\/span><\/span>"], "correctIndex": 0, "image": "", "explanationHtml": "For a current i(t) = 20e^{-3t} A through a 15 mH inductor: V = L(di/dt) = 0.015 × (-3)(20e^{-3t}) = -0.9e^{-3t} V. Energy E = ½LI².", "difficulty": 2}, {"id": "217", "questionHtml": "The voltage across a <span class=\"math\">4 <span class=\"mtext\">H<\/span><\/span> inductor is 40(1-<span class=\"math\">e<sup>-4t<\/sup><\/span>)V. Assume the initial current of the inductor is <span class=\"math\">0.5 <span class=\"mtext\">A<\/span><\/span>, and find the energy stored in the inductor at t = 2s.", "options": ["\\(W = 645.06\\,\\text{J}\\)", "\\(W = 648.06\\,\\text{J}\\)", "\\(W = 682.06\\,\\text{J}\\)"], "optionsHtml": ["<span class=\"math\">W = 645.06 <span class=\"mtext\">J<\/span><\/span>", "<span class=\"math\">W = 648.06 <span class=\"mtext\">J<\/span><\/span>", "<span class=\"math\">W = 682.06 <span class=\"mtext\">J<\/span><\/span>"], "correctIndex": 0, "image": "", "explanationHtml": "For v(t) = 40(1-e^{-10t}) V across a 4 H inductor: i(t) = (1/L)∫v dt + i(0) = (1/4)∫40(1-e^{-10t})dt. Solve the integral and apply the initial condition.", "difficulty": 2}, {"id": "502", "questionHtml": "What is the Laplace transform of u(t)u(t)u(t)?", "options": ["s", "1/s"], "optionsHtml": ["s", "1/s"], "correctIndex": 1, "image": "", "explanationHtml": "", "difficulty": 1}, {"id": "503", "questionHtml": "Which of the following correctly represents a capacitor in the s-domain (zero initial voltage)?", "options": ["sC", "1/C", "1/sC"], "optionsHtml": ["sC", "1/C", "1/sC"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 1}, {"id": "504", "questionHtml": "In DC steady state, a capacitor behaves as an open circuit.", "options": ["TRUE", "FALSE"], "optionsHtml": ["TRUE", "FALSE"], "correctIndex": 0, "image": "", "explanationHtml": "At DC steady state, the capacitor is fully charged and no current flows into it, so it acts as an open circuit (the opposite of an inductor, which acts as a short circuit at DC steady state).", "difficulty": 1}, {"id": "505", "questionHtml": "Initial conditions in Laplace analysis appear as independent sources in the s-domain.", "options": ["TRUE", "FALSE"], "optionsHtml": ["TRUE", "FALSE"], "correctIndex": 0, "image": "", "explanationHtml": "", "difficulty": 1}, {"id": "401", "questionHtml": "Which of the following is NOT a standard assumption for an ideal operational amplifier?", "options": ["Infinite open-loop voltage gain", "Zero input offset voltage and current", "Infinite output impedance"], "optionsHtml": ["Infinite open-loop voltage gain", "Zero input offset voltage and current", "Infinite output impedance"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "402", "questionHtml": "In an ideal op amp, what is the voltage difference between the inverting and non-inverting inputs when negative feedback is applied?", "options": ["Equal to supply voltage", "Zero", "Depends on the input signal"], "optionsHtml": ["Equal to supply voltage", "Zero", "Depends on the input signal"], "correctIndex": 1, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "403", "questionHtml": "What is the configuration of the op-amp shown in the figure?", "options": ["Non-inverting amplifier", "Differential amplifier", "Inverting amplifier"], "optionsHtml": ["Non-inverting amplifier", "Differential amplifier", "Inverting amplifier"], "correctIndex": 2, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Inv.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "404", "questionHtml": "Which op amp configuration provides a positive gain without inverting the input signal?", "options": ["Non-inverting amplifier", "Differential amplifier", "Inverting amplifier"], "optionsHtml": ["Non-inverting amplifier", "Differential amplifier", "Inverting amplifier"], "correctIndex": 0, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "405", "questionHtml": "What is the configuration of the op-amp shown in the figure?", "options": ["Differential amplifier", "Non-inverting amplifier", "Inverting amplifier"], "optionsHtml": ["Differential amplifier", "Non-inverting amplifier", "Inverting amplifier"], "correctIndex": 1, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/NonInv.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "406", "questionHtml": "Which component is essential for setting the gain in an inverting op amp configuration?", "options": ["Capacitor", "Diode", "Resistor"], "optionsHtml": ["Capacitor", "Diode", "Resistor"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "407", "questionHtml": "What happens if the op amp is used without feedback?", "options": ["It acts as comparator", "It amplifies with controlled gain", "It becomes a voltage follower"], "optionsHtml": ["It acts as comparator", "It amplifies with controlled gain", "It becomes a voltage follower"], "correctIndex": 0, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "408", "questionHtml": "What is the main purpose of negative feedback in op amp circuits?", "options": ["Eliminate output voltage", "Increase open-loop gain", "Stabilize and control closed-loop gain"], "optionsHtml": ["Eliminate output voltage", "Increase open-loop gain", "Stabilize and control closed-loop gain"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "409", "questionHtml": "An op-amp is best modeled as which type of dependent source?", "options": ["Current-controlled current source", "Voltage-controlled current source", "Voltage-controlled voltage source"], "optionsHtml": ["Current-controlled current source", "Voltage-controlled current source", "Voltage-controlled voltage source"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "410", "questionHtml": "Why is the output impedance of an ideal op-amp assumed to be zero?", "options": ["To prevent input terminals from drawing current", "Op-amp cannot deliver any current to the load", "To ensure output voltage is unaffected by the connected load"], "optionsHtml": ["To prevent input terminals from drawing current", "Op-amp cannot deliver any current to the load", "To ensure output voltage is unaffected by the connected load"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "411", "questionHtml": "Among the many uses of operational amplifiers, which of the following represents a valid application", "options": ["To generate digital clock pulse", "To amplify voltage signals", "To store electrical charge like a capacitor"], "optionsHtml": ["To generate digital clock pulse", "To amplify voltage signals", "To store electrical charge like a capacitor"], "correctIndex": 1, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "412", "questionHtml": "What is the output voltage Vo in terms of Vi?", "options": ["1-Vi", "Vi", "0"], "optionsHtml": ["1-Vi", "Vi", "0"], "correctIndex": 1, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Follower.jpg?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "413", "questionHtml": "If input voltage is 0, what is the output voltage?", "options": ["\\(0\\,\\text{V}\\)", "\\(1\\,\\text{V}\\)", "\\(2\\,\\text{V}\\)"], "optionsHtml": ["<span class=\"math\">0 <span class=\"mtext\">V<\/span><\/span>", "<span class=\"math\">1 <span class=\"mtext\">V<\/span><\/span>", "<span class=\"math\">2 <span class=\"mtext\">V<\/span><\/span>"], "correctIndex": 0, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Input.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "414", "questionHtml": "Find the output voltage V3.", "options": ["-1", "-3", "-6"], "optionsHtml": ["-1", "-3", "-6"], "correctIndex": 2, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Output.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "415", "questionHtml": "Find the output voltage Vout.", "options": ["9", "10", "12"], "optionsHtml": ["9", "10", "12"], "correctIndex": 2, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Output2.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "416", "questionHtml": "Find the current flowing through R3.", "options": ["\\(1\\,\\text{A}\\)", "\\(2\\,\\text{A}\\)", "\\(3\\,\\text{A}\\)"], "optionsHtml": ["<span class=\"math\">1 <span class=\"mtext\">A<\/span><\/span>", "<span class=\"math\">2 <span class=\"mtext\">A<\/span><\/span>", "<span class=\"math\">3 <span class=\"mtext\">A<\/span><\/span>"], "correctIndex": 0, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Output3.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "417", "questionHtml": "What is the voltage at point A?", "options": ["\\(\\frac{V_1}{R_1} \\cdot R_2\\)", "\\(-\\frac{V_1}{R_1} \\cdot R_2\\)", "\\(V_1\\)"], "optionsHtml": ["<span class=\"math\"><span class=\"frac\"><span class=\"num\">V<sub>1<\/sub><\/span><span class=\"den\">R<sub>1<\/sub><\/span><\/span> · R<sub>2<\/sub><\/span>", "<span class=\"math\">-<span class=\"frac\"><span class=\"num\">V<sub>1<\/sub><\/span><span class=\"den\">R<sub>1<\/sub><\/span><\/span> · R<sub>2<\/sub><\/span>", "<span class=\"math\">V<sub>1<\/sub><\/span>"], "correctIndex": 1, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Output4.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "418", "questionHtml": "What is the current flowing through R3 from the ground?", "options": ["\\(-\\frac{V_1 \\cdot R_2}{R_1 \\cdot R_3}\\)", "\\(\\frac{V_1 \\cdot R_2}{R_1 \\cdot R_3}\\)", "\\(\\frac{V_2}{R_1}\\)"], "optionsHtml": ["<span class=\"math\">-<span class=\"frac\"><span class=\"num\">V<sub>1<\/sub> · R<sub>2<\/sub><\/span><span class=\"den\">R<sub>1<\/sub> · R<sub>3<\/sub><\/span><\/span><\/span>", "<span class=\"math\"><span class=\"frac\"><span class=\"num\">V<sub>1<\/sub> · R<sub>2<\/sub><\/span><span class=\"den\">R<sub>1<\/sub> · R<sub>3<\/sub><\/span><\/span><\/span>", "<span class=\"math\"><span class=\"frac\"><span class=\"num\">V<sub>2<\/sub><\/span><span class=\"den\">R<sub>1<\/sub><\/span><\/span><\/span>"], "correctIndex": 1, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Output4.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "419", "questionHtml": "What is the expression of <span class=\"math\">V<sub>out<\/sub><\/span> in terms of <span class=\"math\">V<sub>in<\/sub><\/span>?", "options": ["\\((R2/R1)*V_{in}\\)", "\\((R1/R2)*V_{in}\\)", "\\((1+R2/R1)*V_{in}\\)"], "optionsHtml": ["<span class=\"math\">(R2/R1)*V<sub>in<\/sub><\/span>", "<span class=\"math\">(R1/R2)*V<sub>in<\/sub><\/span>", "<span class=\"math\">(1+R2/R1)*V<sub>in<\/sub><\/span>"], "correctIndex": 2, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/NonInv.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "420", "questionHtml": "What is the expression of <span class=\"math\">V<sub>out<\/sub><\/span> in terms of <span class=\"math\">V<sub>in<\/sub><\/span>?", "options": ["\\((-R2/R1)*V_{in}\\)", "\\((-R1/R2)*V_{in}\\)", "\\((R2/R1)*V_{in}\\)"], "optionsHtml": ["<span class=\"math\">(-R2/R1)*V<sub>in<\/sub><\/span>", "<span class=\"math\">(-R1/R2)*V<sub>in<\/sub><\/span>", "<span class=\"math\">(R2/R1)*V<sub>in<\/sub><\/span>"], "correctIndex": 0, "image": "https://github.com/raphuniy1s1/Circuit_Analysis/blob/main/Inv.png?raw=true", "explanationHtml": "", "difficulty": 2}, {"id": "301", "questionHtml": "A series RC circuit has <span class=\"math\">R=10 kΩ<\/span> and <span class=\"math\">C=10 μ<span class=\"mtext\">F<\/span><\/span>. A DC source is connected at <span class=\"math\">t=0<\/span>. What is the time constant?", "options": ["$0.01 s$", "$0.1 s$", "$1 s$"], "optionsHtml": ["<span class=\"math\">0.01 s<\/span>", "<span class=\"math\">0.1 s<\/span>", "<span class=\"math\">1 s<\/span>"], "correctIndex": 1, "image": "", "explanationHtml": "The time constant of an RC circuit is τ = R × C. Here R = 10 kΩ = 10,000 Ω and C = 10 μF = 10×10⁻⁶ F. τ = 10,000 × 10×10⁻⁶ = 0.1 s. Answer: B.", "difficulty": 2}, {"id": "302", "questionHtml": "In an RC circuit, <span class=\"math\">v<sub>C<\/sub>(0<sup>-<\/sup>) = 5V<\/span>. What is <span class=\"math\">v<sub>C<\/sub>(0<sup>+<\/sup>)<\/span>?", "options": ["0 V", "2.5 V", "5 V"], "optionsHtml": ["0 V", "2.5 V", "5 V"], "correctIndex": 2, "image": "", "explanationHtml": "A fundamental rule for capacitors: the voltage across a capacitor cannot change instantaneously. Therefore v_C(0⁺) = v_C(0⁻) = 5 V. The capacitor maintains its stored charge at the instant of switching. Answer: C.", "difficulty": 2}, {"id": "303", "questionHtml": "For a charging RC circuit with a DC source, <span class=\"math\">v<sub>C<\/sub>(t)<\/span>", "options": ["Increase linearly", "Increase exponentially", "Oscillate"], "optionsHtml": ["Increase linearly", "Increase exponentially", "Oscillate"], "correctIndex": 1, "image": "", "explanationHtml": "In a charging RC circuit with a DC source V_s, the capacitor voltage follows: v_C(t) = V_s(1 - e^{-t/τ}). This is an exponential approach toward V_s — the voltage increases and gradually levels off (not linearly, not oscillating). Answer: B.", "difficulty": 2}, {"id": "304", "questionHtml": "An RL circuit has <span class=\"math\">R=5 Ω<\/span> and <span class=\"math\">L=2H<\/span>. What is the time constant?", "options": ["0.1 s", "0.4 s", "2.5 s"], "optionsHtml": ["0.1 s", "0.4 s", "2.5 s"], "correctIndex": 1, "image": "", "explanationHtml": "The time constant of an RL circuit is τ = L / R. Here L = 2 H and R = 5 Ω. τ = 2 / 5 = 0.4 s. Answer: D.", "difficulty": 2}, {"id": "305", "questionHtml": "Which statement is always true for an ideal inductor?", "options": ["Voltage is continuous", "Current is continuous", "Power is continuous"], "optionsHtml": ["Voltage is continuous", "Current is continuous", "Power is continuous"], "correctIndex": 1, "image": "", "explanationHtml": "An ideal inductor obeys v = L(di/dt). The inductor current cannot change instantaneously because that would require infinite voltage. Therefore current is always continuous through an inductor. Voltage across an inductor CAN change instantaneously. Answer: B.", "difficulty": 2}, {"id": "306", "questionHtml": "In an RL circuit switched at <span class=\"math\">t=0<\/span>, <span class=\"math\">i<sub>L<\/sub>(0<sup>+<\/sup>)<\/span> is:", "options": ["Steady-state value", "Infinite", "Equal to $i_L(0^-)$"], "optionsHtml": ["Steady-state value", "Infinite", "Equal to <span class=\"math\">i<sub>L<\/sub>(0<sup>-<\/sup>)<\/span>"], "correctIndex": 2, "image": "", "explanationHtml": "Just like capacitor voltage, inductor current cannot change instantaneously. At the moment of switching (t = 0⁺), the inductor current must equal its value just before switching (t = 0⁻): i_L(0⁺) = i_L(0⁻). This is the inductor continuity condition. Answer: C.", "difficulty": 2}, {"id": "307", "questionHtml": "A series RLC circuit is underdamped when:", "options": ["$R^2>\\frac{4L}{C}$", "$R^2=\\frac{4L}{C}$", "$R^2<\\frac{4L}{C}$"], "optionsHtml": ["<span class=\"math\">R<sup>2<\/sup>&gt;<span class=\"frac\"><span class=\"num\">4L<\/span><span class=\"den\">C<\/span><\/span><\/span>", "<span class=\"math\">R<sup>2<\/sup>=<span class=\"frac\"><span class=\"num\">4L<\/span><span class=\"den\">C<\/span><\/span><\/span>", "<span class=\"math\">R<sup>2<\/sup>&lt;<span class=\"frac\"><span class=\"num\">4L<\/span><span class=\"den\">C<\/span><\/span><\/span>"], "correctIndex": 2, "image": "", "explanationHtml": "For a series RLC circuit, the damping condition depends on the discriminant R² - 4L/C. Underdamped: R² &lt; 4L/C (complex roots → oscillatory response). Critically damped: R² = 4L/C. Overdamped: R² &gt; 4L/C. Underdamped means R² &lt; 4L/C. Answer: C.", "difficulty": 2}, {"id": "308", "questionHtml": "The natural response of a circuit is due to:", "options": ["External sources", "Initial stored energy", "AC excitation"], "optionsHtml": ["External sources", "Initial stored energy", "AC excitation"], "correctIndex": 1, "image": "", "explanationHtml": "The natural response is the circuit's behaviour due to energy initially stored in capacitors and inductors, with NO external sources applied. It depends only on initial conditions (stored energy), not on any external input. Answer: B.", "difficulty": 2}, {"id": "309", "questionHtml": "Which is required for a second-order transient response?", "options": ["One resistor", "One capacitor", "One inductor and one capacitor"], "optionsHtml": ["One resistor", "One capacitor", "One inductor and one capacitor"], "correctIndex": 2, "image": "", "explanationHtml": "A second-order circuit requires two independent energy-storage elements. Both an inductor (L) and a capacitor (C) are needed to produce a second-order differential equation and the characteristic transient response (exponential, oscillatory, or critically damped). Answer: C.", "difficulty": 2}, {"id": "310", "questionHtml": "A transient response is usually negligible after about:", "options": ["$1 \\tau$", "$2 \\tau$", "$5 \\tau$"], "optionsHtml": ["<span class=\"math\">1 τ<\/span>", "<span class=\"math\">2 τ<\/span>", "<span class=\"math\">5 τ<\/span>"], "correctIndex": 2, "image": "", "explanationHtml": "The transient component of any response decays as e^{-t/τ}. After 5τ, the exponential term e^{-5} ≈ 0.0067, which is less than 1% of its original value. Engineering convention: the transient is considered negligible after 5 time constants. Answer: C.", "difficulty": 2}, {"id": "311", "questionHtml": "In sinusoidal steady-state analysis, all voltages and currents:", "options": ["Are constant", "Grow exponentially", "Have the source frequency"], "optionsHtml": ["Are constant", "Grow exponentially", "Have the source frequency"], "correctIndex": 2, "image": "", "explanationHtml": "In sinusoidal steady-state (also called AC steady-state), all sources are sinusoidal at frequency ω. After all transients die out, every voltage and current in a linear circuit oscillates at exactly the same frequency as the source — only amplitude and phase differ. Answer: C.", "difficulty": 2}, {"id": "312", "questionHtml": "The phasor of <span class=\"math\">v(t)=10cos(100t+30)<\/span> is:", "options": ["$10 \\angle 5^\\circ$", "$30 \\angle 10^\\circ$", "$5 \\angle 30^\\circ$"], "optionsHtml": ["<span class=\"math\">10 ∠ 5<sup>°<\/sup><\/span>", "<span class=\"math\">30 ∠ 10<sup>°<\/sup><\/span>", "<span class=\"math\">5 ∠ 30<sup>°<\/sup><\/span>"], "correctIndex": 0, "image": "", "explanationHtml": "For v(t) = V_m cos(ωt + φ), the phasor representation is V = V_m∠φ. Here v(t) = 10cos(100t + 30°), so V_m = 10 and φ = 30°. The phasor is 10∠30°. Answer: D.", "difficulty": 2}, {"id": "313", "questionHtml": "The impedance of a capacitor is:", "options": ["\\(j\\Omega C\\)", "\\(1/(j\\Omega C)\\)", "\\(\\Omega C\\)"], "optionsHtml": ["<span class=\"math\">jΩ C<\/span>", "<span class=\"math\">1/(jΩ C)<\/span>", "<span class=\"math\">Ω C<\/span>"], "correctIndex": 1, "image": "", "explanationHtml": "The impedance of a capacitor in the frequency domain is Z_C = 1/(jωC). This comes from the capacitor's v-i relationship: i = C(dv/dt). In phasor form: I = jωC·V, so Z = V/I = 1/(jωC). Answer: B.", "difficulty": 1}, {"id": "314", "questionHtml": "The impedance of an inductor is:", "options": ["$1/(j\\Omega L)$", "$\\Omega L$", "$j\\Omega L$"], "optionsHtml": ["<span class=\"math\">1/(jΩ L)<\/span>", "<span class=\"math\">Ω L<\/span>", "<span class=\"math\">jΩ L<\/span>"], "correctIndex": 2, "image": "", "explanationHtml": "The impedance of an inductor in the frequency domain is Z_L = jωL. This comes from the inductor's v-i relationship: v = L(di/dt). In phasor form: V = jωL·I, so Z = V/I = jωL. Answer: C.", "difficulty": 1}, {"id": "315", "questionHtml": "In a purely capacitive circuit, current:", "options": ["Lags voltage by $90^\\circ$", "Leads voltage by$ 90^\\circ$", "Is in phase"], "optionsHtml": ["Lags voltage by <span class=\"math\">90<sup>°<\/sup><\/span>", "Leads voltage by<span class=\"math\"> 90<sup>°<\/sup><\/span>", "Is in phase"], "correctIndex": 1, "image": "", "explanationHtml": "In a purely capacitive circuit, the current i = C(dv/dt). If v = V_m cos(ωt), then i = -ωCV_m sin(ωt) = ωCV_m cos(ωt + 90°). The current leads the voltage by 90°. Answer: B.", "difficulty": 2}, {"id": "316", "questionHtml": "The average power consumed by a pure inductor is:", "options": ["Maximum", "Reactive only", "Zero"], "optionsHtml": ["Maximum", "Reactive only", "Zero"], "correctIndex": 2, "image": "", "explanationHtml": "The instantaneous power in a pure inductor is p(t) = v·i. Averaged over a full cycle, the positive and negative half-cycles cancel exactly. A pure inductor stores and releases energy each cycle but dissipates zero average (real) power. Answer: C.", "difficulty": 2}, {"id": "317", "questionHtml": "Power factor is defined as:", "options": ["$\\frac{Q}{S}$", "$cos\\theta$", "$\\frac{Vrms}{Irms}$"], "optionsHtml": ["<span class=\"math\"><span class=\"frac\"><span class=\"num\">Q<\/span><span class=\"den\">S<\/span><\/span><\/span>", "<span class=\"math\">cosθ<\/span>", "<span class=\"math\"><span class=\"frac\"><span class=\"num\">Vrms<\/span><span class=\"den\">Irms<\/span><\/span><\/span>"], "correctIndex": 1, "image": "", "explanationHtml": "Power factor (pf) is defined as the cosine of the phase angle θ between voltage and current: pf = cos(θ). It represents the ratio of real power P to apparent power S: pf = P/S = cos(θ). The ratio V_rms/I_rms gives impedance magnitude |Z|, not pf. Answer: B.", "difficulty": 2}, {"id": "318", "questionHtml": "Frequency response analysis studies circuit behavior as:", "options": ["Time varies", "Resistance varies", "Frequency varies"], "optionsHtml": ["Time varies", "Resistance varies", "Frequency varies"], "correctIndex": 2, "image": "", "explanationHtml": "Frequency response analysis studies how a circuit's output (gain and phase) varies as the input signal frequency is swept across a range. It reveals filter cutoff frequencies, resonance, and bandwidth — all as a function of frequency. Answer: D.", "difficulty": 2}, {"id": "319", "questionHtml": "In an RC low-pass filter, output is taken across the:", "options": ["Resistor", "Capacitor", "Source"], "optionsHtml": ["Resistor", "Capacitor", "Source"], "correctIndex": 1, "image": "", "explanationHtml": "In an RC low-pass filter with R in series and C in parallel with the output: at low frequencies, the capacitor impedance 1/(jωC) is large → most voltage appears across C → pass. At high frequencies, the capacitor impedance is small → voltage across C drops → attenuate. The output is taken across the capacitor. Answer: B.", "difficulty": 2}, {"id": "320", "questionHtml": "The total response of a linear circuit equals the sum of:", "options": ["DC and AC", "Input and output", "Transient and steady-state"], "optionsHtml": ["DC and AC", "Input and output", "Transient and steady-state"], "correctIndex": 2, "image": "", "explanationHtml": "The complete (total) response of a linear circuit to any excitation is the sum of two components: 1) The transient (natural) response: dies away with time, depends on initial conditions. 2) The steady-state (forced) response: persists indefinitely, driven by the source. Total response = Transient + Steady-state. Answer: C.", "difficulty": 2}, {"id": "601", "questionHtml": "A transfer function H(s) is defined as:", "options": ["Vin(s) / Vout(s)", "Y(s) / X(s) , where Y is o/p, X is i/p", "I(s) / V(s)"], "optionsHtml": ["Vin(s) / Vout(s)", "Y(s) / X(s) , where Y is o/p, X is i/p", "I(s) / V(s)"], "correctIndex": 0, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "602", "questionHtml": "If a pole lies in the Open Left Half Plane, the response is", "options": ["Exponentially Decaying Sinusoid", "Exponential Decay", "Exponentially Growing Sinusoid"], "optionsHtml": ["Exponentially Decaying Sinusoid", "Exponential Decay", "Exponentially Growing Sinusoid"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "603", "questionHtml": "For a simple RC circuit, if Vin(s) is applied to a series R and C (output across C) the transfer function H(s) = Vc(s) / Vin(s) is:", "options": ["1 / ( sRC + 1)", "sRC / (sRC + 1)", "R / (sRC + 1)"], "optionsHtml": ["1 / ( sRC + 1)", "sRC / (sRC + 1)", "R / (sRC + 1)"], "correctIndex": 0, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "604", "questionHtml": "In a two-port network, the transfer admittance Y21(s) is defined as:", "options": ["V2(s) / I1(s) with V2 = 0", "I2(s) / V2(s) with V2 = 0", "V1(s) / I2(s) with I1 = 0"], "optionsHtml": ["V2(s) / I1(s) with V2 = 0", "I2(s) / V2(s) with V2 = 0", "V1(s) / I2(s) with I1 = 0"], "correctIndex": 1, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "605", "questionHtml": "Which stable output responses y(t) is critically damped?", "options": ["All poles of Y(s) are real, negative and distinct.", "All poles of Y(s) lie in the open LHP with at least 1 pair of complex conjugate poles", "All the poles of Y(s) are real negative with at least 2 same poles"], "optionsHtml": ["All poles of Y(s) are real, negative and distinct.", "All poles of Y(s) lie in the open LHP with at least 1 pair of complex conjugate poles", "All the poles of Y(s) are real negative with at least 2 same poles"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "606", "questionHtml": "Given H(s) = (s + 5) / (s^2 + 3s + 2), the finite poles are at:", "options": ["s = -5", "s = -1, -2", "s= -3"], "optionsHtml": ["s = -5", "s = -1, -2", "s= -3"], "correctIndex": 1, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "607", "questionHtml": "A network function H(s) =                                          10(s + 2) / s(s + 1)(s + 3)^2", "options": ["Double pole at s = -3, zero at s = -2", "Double zero at s = -3, pole at s = -2", "Poles at s= 0, -1, -3"], "optionsHtml": ["Double pole at s = -3, zero at s = -2", "Double zero at s = -3, pole at s = -2", "Poles at s= 0, -1, -3"], "correctIndex": 1, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "608", "questionHtml": "An active network has H(s) = -a / RCs + 1 - a. For stability, we require:", "options": ["a > 1", "a < 1", "a = 1"], "optionsHtml": ["a &gt; 1", "a &lt; 1", "a = 1"], "correctIndex": 1, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "609", "questionHtml": "For a series RLC circuit with R = 4Ω, L = 1H, C = 0.25F, the transfer function Vc(s) / Vin(s) is:", "options": ["\\(1 / s^2 +4s + 4\\)", "\\(4 / s^2 +4s + 4\\)", "\\(1 / s^2 +4s + 1\\)"], "optionsHtml": ["<span class=\"math\">1 / s<sup>2<\/sup> +4s + 4<\/span>", "<span class=\"math\">4 / s<sup>2<\/sup> +4s + 4<\/span>", "<span class=\"math\">1 / s<sup>2<\/sup> +4s + 1<\/span>"], "correctIndex": 2, "image": "", "explanationHtml": "", "difficulty": 2}, {"id": "610", "questionHtml": "For a low-pass RC filter (R = 1kΩ, C = 1μF), the transfer function H(s) = Vo(s)/Vi(s) is:", "options": ["1 / (1 + s)", "1 / (1 + sRC)", "1 / (1 + 0.001s
